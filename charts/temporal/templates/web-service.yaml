{{- if .Values.web.enabled -}}
apiVersion: v1
kind: Service
metadata:
  namespace: {{ include "temporal.kubernetesNamespace" $ }}
  name: {{ include "temporal.componentname" (list $ "web") }}
  labels:
    {{- include "temporal.resourceLabels" (list $ "web" "") | nindent 4 }}
  {{- $serviceAnnotations := mergeOverwrite (include "temporal.resourceAnnotations" (list $ "web" "service") | fromYaml | default dict) (deepCopy (.Values.web.service.annotations | default dict)) -}}
  {{- with $serviceAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.web.service.loadBalancerIP }}
  loadBalancerIP: {{.}}
  {{- end }}
  type: {{ .Values.web.service.type }}
  {{- with .Values.web.service.clusterIP }}
  clusterIP: {{.}}
  {{- end }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: {{ .Values.web.service.appProtocol }}
      name: http
      {{- if hasKey .Values.web.service "nodePort" }}
      nodePort: {{ .Values.web.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "temporal.name" $ }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  {{- end }}
