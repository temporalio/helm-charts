{{- if $.Values.web.enabled }}
{{- if $.Values.web.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  namespace: {{ include "temporal.kubernetesNamespace" $ }}
  name: {{ include "temporal.componentname" (list $ "web") }}-pdb
  labels:
    {{- include "temporal.resourceLabels" (list $ "web" "") | nindent 4 }}
  {{- with include "temporal.resourceAnnotations" (list $ "web" "pdb") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $.Values.web.podDisruptionBudget | nindent 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "temporal.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: web
{{- end }}
{{- end }}
