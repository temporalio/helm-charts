{{- define "temporal.password-env" -}}
{{- $root := index . 0 -}}
{{- $store := index . 1 -}}
valueFrom:
  secretKeyRef:
    name: {{ default (include "temporal.componentname" (list $root (printf "%s-store" $store.name))) $store.config.existingSecret }}
    key: {{ default "password" $store.config.secretKey }}
{{- end -}}

{{/*
Validated secretKeys mapping (config field -> key in existingSecret) for a store, as YAML.
*/}}
{{- define "temporal.persistence.secretKeys" -}}
{{- $store := index . 0 -}}
{{- $secretKeys := $store.config.secretKeys | default dict -}}
{{- if $secretKeys -}}
  {{- if not $store.config.existingSecret -}}
    {{- fail (printf "Please specify existingSecret for %s store when secretKeys is set" $store.name) -}}
  {{- end -}}
  {{- range $field, $key := $secretKeys -}}
    {{- if eq $field "password" -}}
      {{- fail (printf "secretKeys for %s store must not contain password, use secretKey instead" $store.name) -}}
    {{- end -}}
    {{- if contains "." $field -}}
      {{- fail (printf "secretKeys for %s store only supports top-level fields, got %s" $store.name $field) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $secretKeys | toYaml -}}
{{- end -}}

{{/*
secretKeyRef for a single field listed in a store's secretKeys.
*/}}
{{- define "temporal.persistence.secretKeyRef" -}}
{{- $store := index . 0 -}}
{{- $field := index . 1 -}}
valueFrom:
  secretKeyRef:
    name: {{ $store.config.existingSecret }}
    key: {{ index $store.config.secretKeys $field }}
{{- end -}}

{{/*
Server env vars for every field listed in a store's secretKeys, e.g. TEMPORAL_DEFAULT_STORE_USER.
*/}}
{{- define "temporal.persistence.secretKeysEnv" -}}
{{- $store := index . 0 -}}
{{- $prefix := index . 1 -}}
{{- range $field, $_ := (include "temporal.persistence.secretKeys" (list $store) | fromYaml) }}
- name: {{ printf "%s_%s" $prefix (upper $field) }}
  {{- include "temporal.persistence.secretKeyRef" (list $store $field) | nindent 2 }}
{{- end -}}
{{- end -}}

{{/*
Shell prefix for admintools commands that need values which can't be wired directly from a secret.
*/}}
{{- define "temporal.admintools-cmd-prefix" -}}
{{- $store := . -}}
{{- if and (eq $store.driver "sql") (hasKey ($store.config.secretKeys | default dict) "connectAddr") -}}
addr="${SQL_CONNECT_ADDR%%,*}" && export SQL_HOST="${addr%:*}" SQL_PORT="${addr##*:}" && {{ "" }}
{{- end -}}
{{- end -}}
