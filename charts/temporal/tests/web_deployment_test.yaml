suite: test web deployment
templates:
  - web-deployment.yaml
tests:
  - it: omits replica count when not configured
    set:
      web:
        replicaCount: null
    asserts:
      - notExists:
          path: spec.replicas
  - it: schedulerName, runtimeClassName and priorityClassName are unset by default
    asserts:
      - notExists:
          path: spec.template.spec.schedulerName
      - notExists:
          path: spec.template.spec.runtimeClassName
      - notExists:
          path: spec.template.spec.priorityClassName
  - it: sets schedulerName, runtimeClassName and priorityClassName when configured
    set:
      web:
        schedulerName: my-scheduler
        runtimeClassName: my-runtime-class
        priorityClassName: my-priority-class
    asserts:
      - equal:
          path: spec.template.spec.schedulerName
          value: my-scheduler
      - equal:
          path: spec.template.spec.runtimeClassName
          value: my-runtime-class
      - equal:
          path: spec.template.spec.priorityClassName
          value: my-priority-class
  - it: omits strategy when deploymentStrategy is not set
    asserts:
      - notExists:
          path: spec.strategy
  - it: sets strategy from deploymentStrategy
    set:
      web:
        deploymentStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
  - it: prefixes web image with global.imageRegistry when set
    set:
      global:
        imageRegistry: registry.example.com
      web:
        image:
          tag: test-tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "registry.example.com/temporalio/ui:test-tag"
