suite: test web deployment
templates:
  - web-deployment.yaml
tests:
  - it: omits replica count when not configured
    set:
      web:
        replicaCount: null
    asserts:
      - notExists:
          path: spec.replicas
  - it: schedulerName, runtimeClassName and priorityClassName are unset by default
    asserts:
      - notExists:
          path: spec.template.spec.schedulerName
      - notExists:
          path: spec.template.spec.runtimeClassName
      - notExists:
          path: spec.template.spec.priorityClassName
  - it: sets schedulerName, runtimeClassName and priorityClassName when configured
    set:
      web:
        schedulerName: my-scheduler
        runtimeClassName: my-runtime-class
        priorityClassName: my-priority-class
    asserts:
      - equal:
          path: spec.template.spec.schedulerName
          value: my-scheduler
      - equal:
          path: spec.template.spec.runtimeClassName
          value: my-runtime-class
      - equal:
          path: spec.template.spec.priorityClassName
          value: my-priority-class

  - it: does not render automountServiceAccountToken by default
    asserts:
      - notExists:
          path: spec.template.spec.automountServiceAccountToken

  - it: disables the service account token mount when set globally
    set:
      serviceAccount:
        automountServiceAccountToken: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: lets the web component override the global automountServiceAccountToken
    set:
      serviceAccount:
        automountServiceAccountToken: false
      web:
        serviceAccount:
          automountServiceAccountToken: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
