suite: test admintools deployment
templates:
  - admintools-deployment.yaml
tests:
  - it: includes additional init containers
    set:
      admintools:
        additionalInitContainers:
          - name: my-init-container
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: my-init-container
  - it: includes additional volumes
    set:
      admintools:
        additionalVolumes:
          - name: my-volume
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: my-volume
  - it: includes additional volume mounts
    set:
      admintools:
        additionalVolumeMounts:
          - name: my-volume
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: my-volume
  - it: minReadySeconds usage
    set:
      admintools:
        minReadySeconds: 10
    asserts:
      - equal:
          path: spec.minReadySeconds
          value: 10
  - it: TEMPORAL_ADDRESS uses admintools.temporalAddress when set
    set:
      admintools:
        temporalAddress: "my-temporal:7233"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TEMPORAL_ADDRESS
            value: "my-temporal:7233"
  - it: TEMPORAL_ADDRESS falls back to default when admintools.temporalAddress is not set
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TEMPORAL_ADDRESS
            value: RELEASE-NAME-temporal-frontend:7233
  - it: TEMPORAL_ADDRESS falls back to default when admintools.temporalAddress is empty string
    set:
      admintools:
        temporalAddress: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TEMPORAL_ADDRESS
            value: RELEASE-NAME-temporal-frontend:7233
  - it: targets the internal-frontend by default when it is enabled
    set:
      server:
        internal-frontend:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TEMPORAL_ADDRESS
            value: RELEASE-NAME-temporal-internal-frontend:7236
  - it: targets the external frontend when useExternalFrontend is set
    set:
      admintools:
        useExternalFrontend: true
      server:
        internal-frontend:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TEMPORAL_ADDRESS
            value: RELEASE-NAME-temporal-frontend:7233
  - it: does not wire tls by default
    asserts:
      - notExists:
          path: spec.template.spec.volumes[?(@.name=='client-tls')]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=='TEMPORAL_TLS')]
  - it: wires frontend tls when the external frontend has tls
    set:
      server:
        tls:
          frontend:
            enabled: true
            secretName: my-frontend-secret
            serverName: temporal-frontend
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TEMPORAL_TLS_SERVER_NAME
            value: temporal-frontend
      - equal:
          path: spec.template.spec.volumes[?(@.name=='client-tls')].secret.secretName
          value: my-frontend-secret
      # A client cert is always presented so admintools keeps working if the
      # frontend requires client auth; the server ignores it otherwise.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TEMPORAL_TLS_CLIENT_CERT_PATH
            value: /etc/temporal/tls/client/tls.crt
  - it: wires internode tls when it targets the internal-frontend
    set:
      server:
        internal-frontend:
          enabled: true
        tls:
          internode:
            enabled: true
            secretName: my-internode-secret
            serverName: temporal-internode
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TEMPORAL_TLS_SERVER_NAME
            value: temporal-internode
      # internode requireClientAuth defaults to true, so a client cert is presented
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TEMPORAL_TLS_CLIENT_CERT_PATH
            value: /etc/temporal/tls/client/tls.crt
      - equal:
          path: spec.template.spec.volumes[?(@.name=='client-tls')].secret.secretName
          value: my-internode-secret
  - it: does not wire chart tls when a custom temporalAddress is set
    set:
      admintools:
        temporalAddress: "external-lb:7233"
      server:
        tls:
          frontend:
            enabled: true
            secretName: my-frontend-secret
            serverName: temporal-frontend
    asserts:
      - notExists:
          path: spec.template.spec.volumes[?(@.name=='client-tls')]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=='TEMPORAL_TLS')]
  - it: schedulerName, runtimeClassName and priorityClassName are unset by default
    asserts:
      - notExists:
          path: spec.template.spec.schedulerName
      - notExists:
          path: spec.template.spec.runtimeClassName
      - notExists:
          path: spec.template.spec.priorityClassName
  - it: sets schedulerName, runtimeClassName and priorityClassName when configured
    set:
      admintools:
        schedulerName: my-scheduler
        runtimeClassName: my-runtime-class
        priorityClassName: my-priority-class
    asserts:
      - equal:
          path: spec.template.spec.schedulerName
          value: my-scheduler
      - equal:
          path: spec.template.spec.runtimeClassName
          value: my-runtime-class
      - equal:
          path: spec.template.spec.priorityClassName
          value: my-priority-class
  - it: uses global service account by default
    set:
      serviceAccount:
        create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-temporal
  - it: uses default service account when serviceAccount.create is false
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
  - it: uses per-service SA for admintools when configured
    set:
      serviceAccount:
        create: true
      admintools:
        serviceAccount:
          create: true
          name: my-admin-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-admin-sa
  - it: uses auto-generated name for admintools per-service SA
    set:
      admintools:
        serviceAccount:
          create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-temporal-admintools
  - it: falls back to global SA when admintools serviceAccount is empty
    set:
      serviceAccount:
        create: true
      admintools:
        serviceAccount: {}
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-temporal
  - it: uses externally managed SA for admintools
    set:
      admintools:
        serviceAccount:
          create: false
          name: external-admin-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: external-admin-sa
  - it: has no annotations by default
    asserts:
      - isNullOrEmpty:
          path: metadata.annotations
      - isNullOrEmpty:
          path: spec.template.metadata.annotations
  - it: applies global additionalAnnotations to the deployment and the pod
    set:
      additionalAnnotations:
        example.com/owner: platform
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
      - equal:
          path: spec.template.metadata.annotations["example.com/owner"]
          value: platform
  - it: applies deploymentAnnotations to the deployment only
    set:
      admintools:
        deploymentAnnotations:
          example.com/deployment: admintools
    asserts:
      - equal:
          path: metadata.annotations["example.com/deployment"]
          value: admintools
      - isNullOrEmpty:
          path: spec.template.metadata.annotations
  - it: applies podAnnotations to the pod only
    set:
      admintools:
        podAnnotations:
          example.com/pod: admintools
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/pod"]
          value: admintools
      - isNullOrEmpty:
          path: metadata.annotations
  - it: merges component annotations with global additionalAnnotations
    set:
      additionalAnnotations:
        example.com/owner: platform
      admintools:
        deploymentAnnotations:
          example.com/deployment: admintools
        podAnnotations:
          example.com/pod: admintools
    asserts:
      - equal:
          path: metadata.annotations
          value:
            example.com/deployment: admintools
            example.com/owner: platform
      - equal:
          path: spec.template.metadata.annotations
          value:
            example.com/owner: platform
            example.com/pod: admintools
  - it: component annotations win over global additionalAnnotations on the same key
    set:
      additionalAnnotations:
        example.com/owner: platform
      admintools:
        deploymentAnnotations:
          example.com/owner: admintools-deployment
        podAnnotations:
          example.com/owner: admintools-pod
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: admintools-deployment
      - equal:
          path: spec.template.metadata.annotations["example.com/owner"]
          value: admintools-pod
  - it: renders non-string annotation values as strings
    set:
      admintools:
        podAnnotations:
          example.com/replicas: 5
          example.com/enabled: true
          example.com/ratio: 1.5
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/replicas"]
          value: "5"
      - equal:
          path: spec.template.metadata.annotations["example.com/enabled"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["example.com/ratio"]
          value: "1.5"
  - it: renders multiline annotation values
    set:
      admintools:
        podAnnotations:
          example.com/config: |
            first: 1
            second: 2
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/config"]
          value: |
            first: 1
            second: 2
