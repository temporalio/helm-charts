suite: test server autoscaling
templates:
  - server-hpa.yaml
set:
  server:
    enabled: true
    config:
      persistence:
        defaultStore: default
        visibilityStore: visibility
        datastores:
          default:
            sql:
              password: "secret"
          visibility:
            sql:
              password: "secret"
tests:
  - it: skips manifest when autoscaling is disabled
    template: templates/server-hpa.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders only for services that opt in
    template: templates/server-hpa.yaml
    set:
      server:
        history:
          autoscaling:
            enabled: true
            targetCPUUtilizationPercentage: 75
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-temporal-history
      - isKind:
          of: HorizontalPodAutoscaler

  - it: renders service min and max
    template: templates/server-hpa.yaml
    set:
      server:
        matching:
          autoscaling:
            enabled: true
            minReplicas: 3
            maxReplicas: 12
            targetCPUUtilizationPercentage: 75
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-temporal-matching
    asserts:
      - equal:
          path: spec.minReplicas
          value: 3
      - equal:
          path: spec.maxReplicas
          value: 12

  - it: renders a cpu metric
    template: templates/server-hpa.yaml
    set:
      server:
        frontend:
          autoscaling:
            enabled: true
            targetCPUUtilizationPercentage: 75
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-temporal-frontend
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 1
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 75

  - it: renders memory metric when set
    template: templates/server-hpa.yaml
    set:
      server:
        frontend:
          autoscaling:
            enabled: true
            targetMemoryUtilizationPercentage: 80
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-temporal-frontend
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 1
      - equal:
          path: spec.metrics[0].resource.name
          value: memory

  - it: renders both cpu and memory metrics
    template: templates/server-hpa.yaml
    set:
      server:
        history:
          autoscaling:
            enabled: true
            targetCPUUtilizationPercentage: 70
            targetMemoryUtilizationPercentage: 85
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-temporal-history
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 2

  - it: uses built-in liveness initial delay for periodSeconds on non-worker services
    template: templates/server-hpa.yaml
    set:
      server:
        history:
          autoscaling:
            enabled: true
            targetCPUUtilizationPercentage: 75
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-temporal-history
    asserts:
      - equal:
          path: spec.behavior.scaleUp.policies[0].periodSeconds
          value: 150
      - equal:
          path: spec.behavior.scaleDown.policies[0].periodSeconds
          value: 150
      - equal:
          path: spec.behavior.scaleUp.selectPolicy
          value: Min
      - equal:
          path: spec.behavior.scaleDown.selectPolicy
          value: Min
      - equal:
          path: spec.behavior.scaleUp.policies[0].type
          value: Pods
      - equal:
          path: spec.behavior.scaleUp.policies[0].value
          value: 1
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 600

  - it: uses the 15 second floor for worker without configured probes
    template: templates/server-hpa.yaml
    set:
      server:
        worker:
          autoscaling:
            enabled: true
            targetCPUUtilizationPercentage: 75
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-temporal-worker
    asserts:
      - equal:
          path: spec.behavior.scaleUp.policies[0].periodSeconds
          value: 15

  - it: includes startup probe budget in periodSeconds
    template: templates/server-hpa.yaml
    set:
      server:
        history:
          startupProbe:
            periodSeconds: 10
            failureThreshold: 30
          autoscaling:
            enabled: true
            targetCPUUtilizationPercentage: 75
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-temporal-history
    asserts:
      - equal:
          path: spec.behavior.scaleUp.policies[0].periodSeconds
          value: 450

  - it: replaces behavior when the service sets a non-empty map
    template: templates/server-hpa.yaml
    set:
      server:
        history:
          autoscaling:
            enabled: true
            targetCPUUtilizationPercentage: 75
            behavior:
              scaleDown:
                stabilizationWindowSeconds: 300
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-temporal-history
    asserts:
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 300
      - notExists:
          path: spec.behavior.scaleUp

  - it: fails when no metric target is set
    template: templates/server-hpa.yaml
    set:
      server:
        frontend:
          autoscaling:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: server.frontend.autoscaling requires targetCPUUtilizationPercentage or targetMemoryUtilizationPercentage when enabled

  - it: fails when maxReplicas is below minReplicas
    template: templates/server-hpa.yaml
    set:
      server:
        frontend:
          autoscaling:
            enabled: true
            minReplicas: 5
            maxReplicas: 2
            targetCPUUtilizationPercentage: 75
    asserts:
      - failedTemplate:
          errorMessage: server.frontend.autoscaling.maxReplicas must be greater than or equal to minReplicas

  - it: fails when minReplicas is below 1
    template: templates/server-hpa.yaml
    set:
      server:
        frontend:
          autoscaling:
            enabled: true
            minReplicas: 0
    asserts:
      - failedTemplate:
          errorMessage: server.frontend.autoscaling.minReplicas must be at least 1
