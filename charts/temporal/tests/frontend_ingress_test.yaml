suite: test frontend ingress
templates:
  - frontend-ingress.yaml
tests:
  - it: applies additionalAnnotations to the frontend ingress
    set:
      server:
        frontend:
          ingress:
            enabled: true
      additionalAnnotations:
        team: platform
        cost-center: "1234"
    asserts:
      - equal:
          path: metadata.annotations.team
          value: platform
      - equal:
          path: metadata.annotations['cost-center']
          value: "1234"
  - it: ingress.annotations override additionalAnnotations
    set:
      server:
        frontend:
          ingress:
            enabled: true
            annotations:
              team: ingress-team
      additionalAnnotations:
        team: platform
    asserts:
      - equal:
          path: metadata.annotations.team
          value: ingress-team
  - it: omits annotations on the frontend ingress when none are set
    set:
      server:
        frontend:
          ingress:
            enabled: true
    asserts:
      - isNullOrEmpty:
          path: metadata.annotations
