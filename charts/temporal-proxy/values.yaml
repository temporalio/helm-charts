# Default values for temporal-proxy.

# Proxy configuration, matching the temporal-proxy config schema.
# See charts/temporal-proxy/README.md for the config supply model.
config:
  upstreams:
    - name: default
      hostPort: localhost:7233

  routing:
    default: default

# Extra environment variables for the proxy container. Use these to supply
# values referenced with ${VAR} in the config (e.g. Temporal Cloud account id,
# KMS credentials). Chart-generated secret env vars are merged in automatically.
env: []
  # - name: TEMPORAL_ACCOUNT
  #   value: a1b2c
  # - name: TEMPORAL_API_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: temporal-cloud
  #       key: api-key

# Populate environment variables from Secrets or ConfigMaps.
envFrom: []
  # - configMapRef:
  #     name: my-configmap
  # - secretRef:
  #     name: proxy-env

# This will set the replicaset count more information can be found here:
# https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# Deployment rollout strategy. Clients hold long-lived gRPC connections that do not rebalance, and
# the tcpSocket readiness probe cannot catch every broken pod (TLS errors, upstream or KMS loss after
# start), so the default never removes a serving pod before its replacement is Ready: a bad version
# stalls the rollout instead of dropping capacity. Use `maxSurge: 0, maxUnavailable: 1` when the
# cluster runs peak+1 replicas with no free node slot for a surge pod; that relies on readiness
# catching a broken pod. Set to null to use the Kubernetes default (25% surge, 25% unavailable).
# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# A new pod must stay Ready for this many seconds before the rollout continues.
minReadySeconds: 15

# This sets the container image more information can be found here:
# https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: temporalio/temporal-proxy
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here:
# https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# Set to override namespace. Defaults to the release namespace.
namespace: ""

# This section builds out the service account more information can be found here:
# https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}

# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here:
# https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here:
  # https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here:
  # https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8443

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here:
# https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# The proxy serves gRPC only, so the probes check that the listener accepts TCP connections.
livenessProbe:
  tcpSocket:
    port: http

readinessProbe:
  tcpSocket:
    port: http

# Time Kubernetes waits after the preStop hook starts before sending SIGKILL. It must cover the
# preStop sleep plus the proxy's own 30s shutdown budget.
terminationGracePeriodSeconds: 60

# Runs before SIGTERM. The sleep keeps the proxy serving while the pod is removed from Service
# endpoints, so in-flight and newly routed requests are not dropped. Uses the native sleep action
# (Kubernetes 1.30+) because the image has no shell.
lifecycle:
  preStop:
    sleep:
      seconds: 15

# This section is for setting up autoscaling more information can be found here:
# https://kubernetes.io/docs/concepts/workloads/autoscaling/
# The proxy is CPU-bound and clients hold long-lived gRPC connections that don't rebalance: a new
# replica only picks up new connections, and removing a loaded pod forces its clients to reconnect.
# The defaults scale up fairly quickly and scale down slowly, one pod at a time.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
  # Off by default: RSS is sticky and does not fall with load, so a memory target scales up but never back down.
  targetMemoryUtilizationPercentage: null
  # HPA scaling behavior, rendered verbatim into spec.behavior. Set to null to use the Kubernetes defaults.
  # https://kubernetes.io/docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/#configurable-scaling-behavior
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 900
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}
tolerations: []
affinity: {}

# This is for setting up a PodDisruptionBudget more information can be found here:
# https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
podDisruptionBudget: {}
  # minAvailable: 1

# Array of extra K8s manifests to deploy, e.g. an ExternalSecret for upstream mTLS credentials.
# Note: unlike the chart's other templates, these objects are rendered as-is and do not
# automatically inherit the release namespace, labels, or other chart-wide values.
extraObjects: []
