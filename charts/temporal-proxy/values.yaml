# Default values for temporal-proxy.

# Proxy configuration, matching the temporal-proxy config schema.
# See charts/temporal-proxy/README.md for the config supply model.
config:
  upstreams:
    - name: default
      hostPort: localhost:7233
      # A plaintext upstream must say so: without this the proxy dials it with
      # TLS, the handshake fails, and the process exits before it binds the
      # gateway. Drop it (and add a tls block) for a TLS upstream.
      insecure: true

  routing:
    default: default

# Extra environment variables for the proxy container. Use these to supply
# values referenced with ${VAR} in the config (e.g. Temporal Cloud account id,
# KMS credentials). Chart-generated secret env vars are merged in automatically.
env: []
  # - name: TEMPORAL_ACCOUNT
  #   value: a1b2c
  # - name: TEMPORAL_API_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: temporal-cloud
  #       key: api-key

# Populate environment variables from Secrets or ConfigMaps.
envFrom: []
  # - configMapRef:
  #     name: my-configmap
  # - secretRef:
  #     name: proxy-env

# This will set the replicaset count more information can be found here:
# https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here:
# https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: temporalio/temporal-proxy
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here:
# https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# Set to override namespace. Defaults to the release namespace.
namespace: ""

# This section builds out the service account more information can be found here:
# https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}

# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here:
# https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here:
  # https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here:
  # https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8443

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here:
# https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
#
# These carry timings only. The gateway serves gRPC and has no HTTP handler, so
# an httpGet probe against it cannot pass; the chart supplies the handler based
# on whether the gateway runs TLS:
#
#   plaintext gateway -> grpc, checking the proxy's health service (needs 1.27)
#   TLS gateway       -> tcpSocket, because the kubelet's grpc probe dials
#                        plaintext and cannot do TLS
#
# Naming any handler here overrides that. See the chart README for the
# grpc-health-probe exec probe, which does support TLS and works pre-1.27.
# Setting a probe to null omits it.
#
# There is deliberately no startupProbe. The proxy binds the gateway only after
# its upstream connections are ready, and that whole sequence is bounded by the
# fx start timeout (15s by default), after which the process exits rather than
# starting slowly. The failureThreshold below already tolerates several times
# that, so a startupProbe would gate a boot that cannot outlast it. Tightening
# livenessProbe past the boot ceiling is the point at which to add one.

# Deliberately dumb: a restart only fixes process-local faults, so this reports
# whether the gateway is still serving and nothing about the upstream. Wiring
# upstream health in here turns one upstream blip into a fleet-wide restart.
livenessProbe:
  # 4 x 15s tolerates the boot described above before the first restart.
  periodSeconds: 15
  # The 1s default is shorter than a GC pause or a CPU-throttled moment, and a
  # probe that times out counts as a failure.
  timeoutSeconds: 5
  failureThreshold: 4

readinessProbe:
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

# This section is for setting up autoscaling more information can be found here:
# https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}
tolerations: []
affinity: {}

# This is for setting up a PodDisruptionBudget more information can be found here:
# https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
podDisruptionBudget: {}
  # minAvailable: 1

# Array of extra K8s manifests to deploy, e.g. an ExternalSecret for upstream mTLS credentials.
# Note: unlike the chart's other templates, these objects are rendered as-is and do not
# automatically inherit the release namespace, labels, or other chart-wide values.
extraObjects: []
