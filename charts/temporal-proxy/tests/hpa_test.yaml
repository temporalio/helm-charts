suite: HPA test
templates:
  - hpa.yaml
chart:
  version: 1.0.0
  appVersion: 1.0.0
release:
  name: temporal-proxy
  namespace: temporal-proxy
tests:
  - it: skips manifest when autoscaling is disabled
    set:
      autoscaling.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders defaults
    set:
      autoscaling.enabled: true
    asserts:
      - matchSnapshot: {}

  - it: renders custom values
    set:
      fullnameOverride: temporal-proxy
      namespace: testing
      autoscaling:
        enabled: true
        minReplicas: 4
        maxReplicas: 20
        targetCPUUtilizationPercentage: 70
        targetMemoryUtilizationPercentage: 90
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - isAPIVersion:
          of: autoscaling/v2
      - equal:
          path: metadata.name
          value: temporal-proxy
      - equal:
          path: metadata.namespace
          value: testing
      - equal:
          path: spec.scaleTargetRef.name
          value: temporal-proxy
      - equal:
          path: spec.minReplicas
          value: 4
      - equal:
          path: spec.maxReplicas
          value: 20
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 70
      - equal:
          path: spec.metrics[1].resource.target.averageUtilization
          value: 90

  - it: omits cpu metric when target is unset
    set:
      autoscaling:
        enabled: true
        targetCPUUtilizationPercentage: null
        targetMemoryUtilizationPercentage: 80
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 1
      - equal:
          path: spec.metrics[0].resource.name
          value: memory

  - it: omits memory metric by default
    set:
      autoscaling.enabled: true
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 1
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu

  - it: fails when no metric target is set
    set:
      autoscaling:
        enabled: true
        targetCPUUtilizationPercentage: null
        targetMemoryUtilizationPercentage: null
    asserts:
      - failedTemplate:
          errorMessage: autoscaling.enabled requires autoscaling.targetCPUUtilizationPercentage or autoscaling.targetMemoryUtilizationPercentage

  - it: renders the default replicas, cpu target, and scaling behavior
    set:
      autoscaling.enabled: true
    asserts:
      - equal:
          path: spec.minReplicas
          value: 1
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 65
      - equal:
          path: spec.behavior
          value:
            scaleUp:
              stabilizationWindowSeconds: 60
              policies:
                - type: Pods
                  value: 2
                  periodSeconds: 60
            scaleDown:
              stabilizationWindowSeconds: 900
              policies:
                - type: Pods
                  value: 1
                  periodSeconds: 300

  - it: renders an overridden scaling behavior
    set:
      autoscaling:
        enabled: true
        behavior:
          scaleUp: null
          scaleDown:
            stabilizationWindowSeconds: 300
            selectPolicy: Min
            policies:
              - type: Percent
                value: 10
                periodSeconds: 60
    asserts:
      - notExists:
          path: spec.behavior.scaleUp
      - equal:
          path: spec.behavior.scaleDown
          value:
            stabilizationWindowSeconds: 300
            selectPolicy: Min
            policies:
              - type: Percent
                value: 10
                periodSeconds: 60

  - it: omits behavior when it is null
    set:
      autoscaling:
        enabled: true
        behavior: null
    asserts:
      - notExists:
          path: spec.behavior

  - it: omits behavior when all of its keys are removed
    set:
      autoscaling:
        enabled: true
        behavior:
          scaleUp: null
          scaleDown: null
    asserts:
      - notExists:
          path: spec.behavior
